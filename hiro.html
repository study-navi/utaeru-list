<!DOCTYPE html>
<html lang="ja" data-utalis-viewer="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>ひろ - Utalis</title>
<style>
  :root {
    color-scheme: light only;
    --page: #f6f6f4;
    --surface: #ffffff;
    --surface-2: #f0efec;
    --text-primary: #171717;
    --text-secondary: #43423e;
    --text-muted: #5f5e59;
    --grid: #e2e1dd;
    --border: #e2e1dd;
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --accent-wash: #eaf1fb;
    --chip-bg: #ffffff;
    --chip-border: #e2e1dd;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { color-scheme: light only; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 56px; }

  header.top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--grid);
  }
  .top-main { min-width: 0; flex: 1; }
  .page-kind {
    margin: 0 0 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  h1 {
    font-size: 21px;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
    line-height: 1.25;
    word-break: break-word;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 8px;
    line-height: 1.55;
    word-break: break-word;
  }
  .header-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .header-stats strong {
    font-weight: 800;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  .utalis-mark {
    flex: 0 0 auto;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    opacity: 0.55;
    padding-top: 2px;
  }

  .search-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--page);
    padding: 8px 0 10px;
    margin-bottom: 6px;
  }
  .search-shell {
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 1px 3px rgba(23, 23, 23, 0.04);
  }
  .search-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }
  .search-input-row { position: relative; }
  input[type="search"] {
    width: 100%;
    font-size: 16px;
    min-height: 44px;
    padding: 11px 40px 11px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--grid);
    background: #ffffff;
    color: var(--text-primary);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="search"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  input[type="search"]::placeholder { color: var(--text-muted); }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .clear-btn {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: none;
    font-size: 16px;
    border-radius: 8px;
  }
  .clear-btn:hover { background: var(--surface-2); }

  .gyo-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0 2px;
  }
  .chip {
    font-size: 13px;
    min-height: 34px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--chip-border);
    background: var(--chip-bg);
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
  }
  .chip:hover { background: var(--surface-2); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
  }

  .result-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin: 12px 2px 6px;
  }

  .filter-row {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 2px 6px;
    margin: 6px -2px 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .filter-row::-webkit-scrollbar { height: 4px; }
  .filter-row .chip { flex: 0 0 auto; white-space: nowrap; }
  .filter-summary {
    font-size: 11.5px;
    color: var(--text-muted);
    margin: -2px 2px 8px;
  }

  .random-row { margin: 6px 0 4px; }
  .random-btn {
    font-size: 13px;
    min-height: 38px;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--grid);
    background: var(--surface);
    color: var(--text-primary);
    cursor: pointer;
  }
  .random-btn:hover { background: var(--surface-2); }
  .random-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .random-pick {
    margin-top: 8px;
    padding: 12px 14px;
    background: var(--accent-wash);
    border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--grid));
    border-radius: 12px;
    font-size: 14px;
    display: none;
  }
  .random-pick .rp-title { font-weight: 800; font-size: 16px; color: var(--text-primary); line-height: 1.35; }
  .random-pick .rp-artist { color: var(--text-muted); font-size: 12.5px; margin-top: 4px; }

  .artist-block { margin-bottom: 18px; }
  .artist-block:last-child { margin-bottom: 0; }
  .artist-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    padding: 0 0 6px;
    margin: 0 0 2px;
    border-bottom: 1px solid var(--grid);
    line-height: 1.4;
    word-break: break-word;
  }
  .artist-count-inline {
    font-weight: 500;
    color: var(--text-muted);
    font-size: 12px;
    margin-left: 6px;
  }
  ul.song-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.song-list li {
    padding: 10px 0;
    border-bottom: 1px solid var(--grid);
  }
  ul.song-list li:last-child { border-bottom: none; }
  mark {
    background: var(--accent-wash);
    color: var(--text-primary);
    border-radius: 3px;
    padding: 0 1px;
  }

  .song-main-row { display: flex; align-items: flex-start; gap: 8px; }
  .song-title {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--text-primary);
    word-break: break-word;
  }
  .v-badges {
    display: inline-flex;
    gap: 2px;
    flex: 0 0 auto;
    font-size: 11px;
    line-height: 1;
    opacity: 0.82;
    padding-top: 3px;
  }
  .v-tag-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .v-tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-muted);
    border: 1px solid var(--grid);
    line-height: 1.5;
  }
  .v-tag-more { color: var(--text-muted); }

  .empty-state {
    text-align: center;
    padding: 40px 16px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .empty-state .emoji { font-size: 28px; margin-bottom: 8px; }

  footer {
    margin-top: 24px;
    padding-top: 14px;
    border-top: 1px solid var(--grid);
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.65;
  }
  footer a { color: var(--text-secondary); }

  @media (max-width: 430px) {
    .wrap { padding: 14px 14px 48px; }
    h1 { font-size: 19px; }
    .chip { font-size: 12.5px; min-height: 32px; padding: 5px 10px; }
    .song-title { font-size: 15px; }
    .random-btn {
      max-width: 100%;
      white-space: normal;
      line-height: 1.4;
    }
    .filter-row {
      flex-wrap: wrap;
      overflow-x: hidden;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="top-main">
      <p class="page-kind">歌える曲リスト</p>
      <h1 id="streamerName">ひろ</h1>
      <p class="subtitle" id="subtitle">ひろの配信で歌える曲を検索できます。曲名・アーティスト名で絞り込めます。</p>
      <div class="header-stats">
        <span><strong id="statSongs">-</strong> 曲</span>
        <span><strong id="statArtists">-</strong> 組</span>
        <span>更新 <strong id="statUpdated">-</strong></span>
      </div>
    </div>
    <span class="utalis-mark" aria-hidden="true">Utalis</span>
  </header>

  <div class="search-bar">
    <div class="search-shell">
      <label class="search-label" for="searchInput">曲名・アーティスト名で検索</label>
      <div class="search-input-row">
        <input type="search" id="searchInput" placeholder="例：Story / AI" autocomplete="off" />
        <button class="clear-btn" id="clearBtn" aria-label="検索をクリア">✕</button>
      </div>
      <div class="gyo-row" id="gyoRow"></div>
    </div>
  </div>

  <div class="filter-row" id="statusFilterRow"></div>
  <div class="filter-row" id="tagFilterRow" style="display:none;"></div>

  <div class="random-row">
    <button class="random-btn" id="randomBtn">🎲 表示中からランダム</button>
    <div class="random-pick" id="randomPick"></div>
  </div>

  <div class="result-meta" id="resultMeta"></div>
  <div class="filter-summary" id="filterSummary" style="display:none;"></div>

  <div id="results"></div>

  <footer>
    データ提供元：Mirrativ（ミラティブ）内カラオケアプリ「エモカラ」の楽曲一覧を個人配布しているGoogle Driveより取得（2026/7/28時点のカタログ）。配信者が歌える曲として選択したものを掲載しています。配信状況や仕様変更により、実際に歌える曲は変動する場合があります。
  </footer>

</div>

<script type="application/json" id="builder-config">{"streamerName":"ひろ","subtitle":"ひろの配信で歌える曲を検索できます。曲名・アーティスト名で絞り込めます。","themeType":"preset","presetIndex":0,"customHex":null,"selected":["相川七瀬\u0001夢見る少女じゃいられない","相川七瀬\u0001恋心","相川七瀬\u0001Sweet Emotion","aiko\u0001カブトムシ","aiko\u0001ボーイフレンド","aiko\u0001KissHug","aiko\u0001相思相愛","aiko\u0001横顔","aiko\u0001恋のスーパーボール","aiko\u0001キラキラ","aiko\u0001milk","aiko\u0001花火","aiko\u0001二時頃","aiko\u0001ストロー"]}</script>
<script>
// 埋め込みの曲データは既存契約どおり、ここでトップレベルの SONGS にそのまま代入する
// (この代入の形は互換性検証スクリプトが前提にしているため変更しない)。
const SONGS = [{"k":"あ","y":"あいかわななせ","a":"相川七瀬","t":"夢見る少女じゃいられない"},{"k":"あ","y":"あいかわななせ","a":"相川七瀬","t":"恋心"},{"k":"あ","y":"あいかわななせ","a":"相川七瀬","t":"Sweet Emotion"},{"k":"あ","y":"あいこ","a":"aiko","t":"カブトムシ"},{"k":"あ","y":"あいこ","a":"aiko","t":"ボーイフレンド"},{"k":"あ","y":"あいこ","a":"aiko","t":"KissHug"},{"k":"あ","y":"あいこ","a":"aiko","t":"相思相愛"},{"k":"あ","y":"あいこ","a":"aiko","t":"横顔"},{"k":"あ","y":"あいこ","a":"aiko","t":"恋のスーパーボール"},{"k":"あ","y":"あいこ","a":"aiko","t":"キラキラ"},{"k":"あ","y":"あいこ","a":"aiko","t":"milk"},{"k":"あ","y":"あいこ","a":"aiko","t":"花火"},{"k":"あ","y":"あいこ","a":"aiko","t":"二時頃"},{"k":"あ","y":"あいこ","a":"aiko","t":"ストロー"}];

// Phase 4A: 「埋め込みデータ(builder-config)の取得・解釈」と「画面への描画」を分離しておく。
// 将来この関数の中身だけを GET /api/public/{id} を呼ぶ非同期実装に差し替えれば、
// 以降の描画ロジック（render() 等）には手を入れずに済むようにするための下準備。
// 現時点ではサーバー通信は一切行わず、HTML内に埋め込まれたbuilder-configを読み取るだけ。
// 返り値の形は、将来 D1 等から返す想定の公開データ形式（docs/public-data-format.schema.json）に合わせている。
// 埋め込みが無い・壊れている場合はすべて空値にフォールバックし、エラーにはしない（旧v1形式の互換性維持）。
function loadEmbeddedPublicData() {
  let cfg = {};
  try {
    const cfgEl = document.getElementById('builder-config');
    if (cfgEl && cfgEl.textContent.trim()) cfg = JSON.parse(cfgEl.textContent);
  } catch (e) { cfg = {}; }
  return {
    version: Number.isInteger(cfg.configVersion) ? cfg.configVersion : 1,
    streamer: {
      id: (typeof cfg.streamerId === 'string' && cfg.streamerId) ? cfg.streamerId : null,
      name: cfg.streamerName || '',
      subtitle: cfg.subtitle || '',
    },
    songs: SONGS,
    songMeta: (cfg.songMeta && typeof cfg.songMeta === 'object') ? cfg.songMeta : {},
    tagPresets: Array.isArray(cfg.tagPresets) ? cfg.tagPresets : [],
    updatedAt: cfg.updatedAt || null,
  };
}

const PUBLIC_DATA = loadEmbeddedPublicData();
const SONG_META = PUBLIC_DATA.songMeta;
const TAG_PRESETS = PUBLIC_DATA.tagPresets;
function keyOf(s) { return s.a + '' + s.t; }

const STATUS_LABELS = {
  signature: { emoji: '⭐', label: 'おはこ' },
  welcome: { emoji: '🎤', label: 'リクエストOK' },
  learning: { emoji: '📖', label: '練習中' },
};
const NEW_ARRIVAL_DAYS = 30;
function isNewArrival(addedAt) {
  if (!addedAt) return false;
  const added = new Date(addedAt + 'T00:00:00');
  if (isNaN(added.getTime())) return false;
  const diffDays = (new Date() - added) / 86400000;
  return diffDays >= 0 && diffDays <= NEW_ARRIVAL_DAYS;
}

const GYO = [
  { label: 'あ', chars: 'あいうえお' },
  { label: 'か', chars: 'かきくけこがぎぐげご' },
  { label: 'さ', chars: 'さしすせそざじずぜぞ' },
  { label: 'た', chars: 'たちつてとだぢづでど' },
  { label: 'な', chars: 'なにぬねの' },
  { label: 'は', chars: 'はひふへほばびぶべぼぱぴぷぺぽ' },
  { label: 'ま', chars: 'まみむめも' },
  { label: 'や', chars: 'やゆよ' },
  { label: 'ら', chars: 'らりるれろ' },
  { label: 'わ', chars: 'わをん' },
];

function gyoOf(kanaHead) {
  for (const g of GYO) {
    if (g.chars.includes(kanaHead)) return g.label;
  }
  return null;
}

function toHiragana(str) {
  return str.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
function norm(str) {
  return toHiragana(str).toLowerCase();
}

const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const gyoRow = document.getElementById('gyoRow');
const resultsEl = document.getElementById('results');
const resultMeta = document.getElementById('resultMeta');
const filterSummaryEl = document.getElementById('filterSummary');
const statusFilterRow = document.getElementById('statusFilterRow');
const tagFilterRow = document.getElementById('tagFilterRow');
const randomBtn = document.getElementById('randomBtn');
const randomPick = document.getElementById('randomPick');

let activeGyo = null;
let activeStatus = null;   // null | 'signature' | 'welcome' | 'learning'
let newOnly = false;       // Phase 3: 🆕新着 トグル（状態フィルタとは独立、AND条件）
let activeTags = new Set(); // Phase 3: 複数選択可・選択されたタグのいずれかを含む曲（OR条件）
let lastFiltered = [];     // Phase 3: 「表示中からランダム」で使用

const allChip = document.createElement('div');
allChip.className = 'chip active';
allChip.textContent = 'すべて';
allChip.addEventListener('click', () => setGyo(null));
gyoRow.appendChild(allChip);

GYO.forEach(g => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = g.label + '行';
  chip.addEventListener('click', () => setGyo(g.label));
  gyoRow.appendChild(chip);
});

function setGyo(label) {
  activeGyo = label;
  [...gyoRow.children].forEach(c => c.classList.remove('active'));
  const idx = label ? GYO.findIndex(g => g.label === label) + 1 : 0;
  gyoRow.children[idx].classList.add('active');
  render();
}

// ---- Phase 3: 状態・新着フィルタ（1行・横スクロール、すべて/状態3種は単一選択、🆕新着は独立トグル） ----
const statusAllChip = document.createElement('div');
statusAllChip.className = 'chip active';
statusAllChip.textContent = 'すべて';
statusAllChip.addEventListener('click', () => { activeStatus = null; refreshStatusChips(); render(); });
statusFilterRow.appendChild(statusAllChip);

const statusChips = {};
Object.keys(STATUS_LABELS).forEach(value => {
  const meta = STATUS_LABELS[value];
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = `${meta.emoji} ${meta.label}`;
  chip.addEventListener('click', () => { activeStatus = value; refreshStatusChips(); render(); });
  statusFilterRow.appendChild(chip);
  statusChips[value] = chip;
});

const hasAnyNewArrival = SONGS.some(s => isNewArrival((SONG_META[keyOf(s)] || {}).addedAt));
let newChip = null;
if (hasAnyNewArrival) {
  newChip = document.createElement('div');
  newChip.className = 'chip';
  newChip.textContent = '🆕 新着';
  newChip.addEventListener('click', () => { newOnly = !newOnly; refreshStatusChips(); render(); });
  statusFilterRow.appendChild(newChip);
}

function refreshStatusChips() {
  statusAllChip.classList.toggle('active', activeStatus === null);
  Object.keys(statusChips).forEach(value => statusChips[value].classList.toggle('active', activeStatus === value));
  if (newChip) newChip.classList.toggle('active', newOnly);
}

// ---- Phase 3: タグフィルタ（実際に使われているタグのみ・複数選択でOR条件） ----
const usedTagIds = new Set();
SONGS.forEach(s => {
  const m = SONG_META[keyOf(s)];
  if (m && Array.isArray(m.tags)) m.tags.forEach(id => usedTagIds.add(id));
});
const usedTags = TAG_PRESETS.filter(t => usedTagIds.has(t.id));

if (usedTags.length > 0) {
  tagFilterRow.style.display = 'flex';
  usedTags.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = t.label;
    chip.addEventListener('click', () => {
      if (activeTags.has(t.id)) activeTags.delete(t.id); else activeTags.add(t.id);
      chip.classList.toggle('active', activeTags.has(t.id));
      render();
    });
    tagFilterRow.appendChild(chip);
  });
}

function updateFilterSummary() {
  const parts = [];
  if (activeGyo) parts.push(`${activeGyo}行`);
  if (activeStatus && STATUS_LABELS[activeStatus]) parts.push(`${STATUS_LABELS[activeStatus].emoji} ${STATUS_LABELS[activeStatus].label}`);
  if (newOnly) parts.push('🆕 新着');
  if (activeTags.size > 0) {
    const labels = [...activeTags].map(id => {
      const t = TAG_PRESETS.find(t => t.id === id);
      return t ? t.label : null;
    }).filter(Boolean);
    if (labels.length) parts.push(labels.join(' / '));
  }
  if (parts.length === 0) {
    filterSummaryEl.style.display = 'none';
    filterSummaryEl.textContent = '';
  } else {
    filterSummaryEl.style.display = 'block';
    filterSummaryEl.textContent = `絞り込み中: ${parts.join(' ・ ')}`;
  }
}

function songRowHtml(s, q) {
  const meta = SONG_META[keyOf(s)] || {};
  const statusOpt = STATUS_LABELS[meta.status];
  const badges = [];
  if (statusOpt) badges.push(`<span class="v-badge" title="${escapeHtml(statusOpt.label)}">${statusOpt.emoji}</span>`);
  if (isNewArrival(meta.addedAt)) badges.push(`<span class="v-badge" title="新着">🆕</span>`);
  const tagObjs = Array.isArray(meta.tags)
    ? meta.tags.map(id => TAG_PRESETS.find(t => t.id === id)).filter(Boolean)
    : [];
  const shownTags = tagObjs.slice(0, 2);
  const restCount = tagObjs.length - shownTags.length;
  const tagsHtml = tagObjs.length
    ? `<div class="v-tag-row">${shownTags.map(t => `<span class="v-tag">${escapeHtml(t.label)}</span>`).join('')}${restCount > 0 ? `<span class="v-tag v-tag-more">+${restCount}</span>` : ''}</div>`
    : '';
  return `
    <li>
      <div class="song-main-row">
        <span class="song-title">${highlight(s.t, q)}</span>
        ${badges.length ? `<span class="v-badges">${badges.join('')}</span>` : ''}
      </div>
      ${tagsHtml}
    </li>`;
}

function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const nText = norm(text);
  const nQ = norm(q);
  const i = nText.indexOf(nQ);
  if (i === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, i)) + '<mark>' + escapeHtml(text.slice(i, i + q.length)) + '</mark>' + escapeHtml(text.slice(i + q.length));
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const q = searchInput.value.trim();
  clearBtn.style.display = q ? 'block' : 'none';

  // Phase 3: 検索条件 AND 行フィルタ AND 状態フィルタ AND 新着フィルタ AND タグ条件（タグのみOR）
  let filtered = SONGS;
  if (activeGyo) {
    filtered = filtered.filter(s => gyoOf(s.k) === activeGyo);
  }
  if (q) {
    const nq = norm(q);
    filtered = filtered.filter(s => norm(s.t).includes(nq) || norm(s.a).includes(nq) || norm(s.y).includes(nq));
  }
  if (activeStatus) {
    filtered = filtered.filter(s => (SONG_META[keyOf(s)] || {}).status === activeStatus);
  }
  if (newOnly) {
    filtered = filtered.filter(s => isNewArrival((SONG_META[keyOf(s)] || {}).addedAt));
  }
  if (activeTags.size > 0) {
    filtered = filtered.filter(s => {
      const tags = (SONG_META[keyOf(s)] || {}).tags || [];
      return tags.some(id => activeTags.has(id));
    });
  }

  lastFiltered = filtered;
  randomBtn.disabled = filtered.length === 0;

  const artistCount = new Set(filtered.map(s => s.a)).size;
  resultMeta.textContent = `${filtered.length}曲 / ${artistCount}組`;
  updateFilterSummary();

  if (SONGS.length === 0) {
    resultsEl.innerHTML = '<div class="empty-state"><div class="emoji">🎤</div>まだ曲が登録されていません</div>';
    return;
  }

  if (filtered.length === 0) {
    resultsEl.innerHTML = '<div class="empty-state"><div class="emoji">🔍</div>該当する曲が見つかりませんでした</div>';
    return;
  }

  const groups = [];
  let cur = null;
  for (const s of filtered) {
    if (!cur || cur.artist !== s.a) {
      cur = { artist: s.a, songs: [] };
      groups.push(cur);
    }
    cur.songs.push(s);
  }

  const MAX_GROUPS = 400;
  const shown = groups.slice(0, MAX_GROUPS);

  resultsEl.innerHTML = shown.map(g => `
    <div class="artist-block">
      <div class="artist-name">${highlight(g.artist, q)}<span class="artist-count-inline">${g.songs.length}曲</span></div>
      <ul class="song-list">
        ${g.songs.map(s => songRowHtml(s, q)).join('')}
      </ul>
    </div>
  `).join('');

  if (groups.length > MAX_GROUPS) {
    const note = document.createElement('div');
    note.className = 'result-meta';
    note.textContent = `他 ${groups.length - MAX_GROUPS} 組は絞り込みを続けると表示されます`;
    resultsEl.appendChild(note);
  }
}

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => { searchInput.value = ''; render(); searchInput.focus(); });

randomBtn.addEventListener('click', () => {
  const pool = lastFiltered;
  if (!pool || pool.length === 0) {
    randomPick.style.display = 'block';
    randomPick.innerHTML = `<div class="rp-title">条件に一致する曲がありません</div>`;
    return;
  }
  const pick = pool[Math.floor(Math.random() * pool.length)];
  randomPick.style.display = 'block';
  randomPick.innerHTML = `<div class="rp-title">${escapeHtml(pick.t)}</div><div class="rp-artist">${escapeHtml(pick.a)}</div>`;
});

document.getElementById('statSongs').textContent = SONGS.length.toLocaleString('ja-JP');
document.getElementById('statArtists').textContent = new Set(SONGS.map(s => s.a)).size.toLocaleString('ja-JP');
document.getElementById('statUpdated').textContent = '2026/7/28';

render();
</script>
</body>
